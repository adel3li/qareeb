<!-- @dsCard group="Guided experience" height=640 subtitle="step 2, الموقف: one sentence shown, the next on its way; «التالي» waits" -->
<div class="q-demo" dir="rtl" lang="ar" style="padding: 0; gap: 0;">
  <div class="q-live">
    <p class="q-live__step">٢ · الموقف</p>
    <div class="q-live__frame">
      <div class="q-live__lines" aria-live="polite" id="q-lines"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <button type="button" class="q-btn q-btn--quiet" style="align-self: center;" id="q-all"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg>أظهر النص كاملًا</button>
      <button type="button" class="q-btn q-btn--primary q-btn--block" aria-disabled="true" id="q-next">التالي</button>
    </div>
  </div>
</div>
<script>
  (function () {
    var lines = ['نبيٌّ في الظلمات، وحده، ينادي ربه.', 'تخيّل أنك أنت من ضاقت به الأرض حتى لم يبقَ له إلا هذا النداء.'];
    var box = document.getElementById('q-lines'), next = document.getElementById('q-next'), shown = 0, timer;
    function show(n) {
      while (shown < n) { var p = document.createElement('p'); p.className = 'q-live__line'; p.textContent = lines[shown++]; box.appendChild(p); }
      if (shown >= lines.length) { clearInterval(timer); next.setAttribute('aria-disabled', 'false'); document.getElementById('q-all').hidden = true; }
    }
    show(1);
    timer = setInterval(function () { show(shown + 1); }, 2800);
    document.getElementById('q-all').addEventListener('click', function () { show(lines.length); });
  })();
</script>
