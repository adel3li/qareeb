<!-- @dsCard group="Inputs" height=200 subtitle="the text-size setting with its live sample" -->
<div class="q-demo" dir="rtl" lang="ar">
  <div class="q-stepper">
    <label class="q-field__label" for="q-size" style="font-size: 1rem; font-weight: 400;">حجم النص</label>
    <div class="q-stepper__ctrl">
      <button type="button" class="q-stepper__btn" aria-label="أصغر">−</button>
      <input class="q-stepper__value" id="q-size" type="text" inputmode="numeric" value="١٦">
      <button type="button" class="q-stepper__btn" aria-label="أكبر">+</button>
    </div>
  </div>
  <p class="q-banner" style="font-weight: 400; color: var(--text-body); line-height: 1.8;">هكذا يظهر النص في البطاقة والتجربة.</p>
</div>
